plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.poultrynow.app" // keep yours the same if different
    compileSdk 34
    ndkVersion "25.1.8937393"  // <-- THIS FIXES THE FILE_PICKER ERROR

    defaultConfig {
        applicationId "com.poultrynow.app" // keep yours the same if different
        minSdk 21
        targetSdk 34
        versionCode 40
        versionName "1.0.40"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
}
